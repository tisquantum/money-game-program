[package]
name = "money-game"
version = "0.2.0"
description = "Money: a five-seat, 44-minute trust game for token holders. Hidden moves run in a MagicBlock Private Ephemeral Rollup, randomness comes from MagicBlock VRF."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "money_game"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
custom-heap = []
custom-panic = []
anchor-debug = []

[dependencies]
anchor-lang = { version = "1.0.2", features = ["init-if-needed"] }
anchor-spl = { version = "1.0.2", default-features = false, features = ["solana-v3", "token", "token_2022", "associated_token"] }
bytemuck = { version = "1", features = ["derive", "min_const_generics"] }
ephemeral-rollups-sdk = { version = "0.17.3", features = ["anchor", "access-control", "vrf"] }
session-keys = { version = "=3.1.1", features = ["no-entrypoint"] }
